name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plecl-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  lisp:
    uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
    with:
      os-json: '["ubuntu-latest","macos-latest","windows-latest"]'

  extension-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker SQL suite
        run: docker build -f docker/Dockerfile -t plecl-test . && docker run --rm plecl-test

  extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pack: linux-x86_64
          - os: macos-latest
            pack: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Deps (Ubuntu)
        if: runner.os == 'Linux'
        run: ./scripts/ci-deps.sh linux

      - name: Deps (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/ci-deps.sh macos

      - name: Build and install
        run: |
          set -euo pipefail
          if command -v ecl-config >/dev/null; then
            echo "ECL $(ecl-config --cflags) $(ecl-config --libs)"
          fi
          pg_config --version
          make
          if [[ "$(uname -s)" == Linux ]]; then
            sudo make install
          else
            make install
          fi

      - name: SQL suite
        run: ./scripts/run-sql-tests.sh

      - name: Pack
        run: ./scripts/pack-release.sh "${{ matrix.pack }}"

      - uses: actions/upload-artifact@v4
        with:
          name: plecl-${{ matrix.pack }}
          path: dist/plecl-*
          if-no-files-found: error

  extension-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ecl-msvc
          key: ecl-24.5.10-msvc-win64-md-gc
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgsql
          key: pg-16.15-1-windows-x64-edb
      - name: Build and install (MSVC + EDB)
        env:
          ECL_PREFIX: ${{ runner.temp }}\ecl-msvc
          PG_MSVC_ROOT: ${{ runner.temp }}\pgsql
        run: powershell -File scripts/ci-windows-msvc.ps1
      - name: SQL suite
        shell: bash
        run: ./scripts/run-sql-tests.sh
      - name: Pack
        shell: bash
        run: ./scripts/pack-release.sh windows-x86_64-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: plecl-windows-x86_64-msvc
          path: dist/plecl-*
          if-no-files-found: error
